image: php:8.2

variables:
  APP_ENV: testing
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: test_db
  DB_USERNAME: root
  DB_PASSWORD: comsc
  CACHE_DRIVER: array
  SESSION_DRIVER: array
  QUEUE_CONNECTION: sync
  MYSQL_DATABASE: test_db
  MYSQL_ROOT_PASSWORD: comsc

services:
  - name: mysql:8.0
    alias: mysql
    command: [ "--default-authentication-plugin=mysql_native_password" ]

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - vendor/
    - node_modules/

stages:
  - prepare
  - test

before_script:
  - apt-get update && apt-get install -y unzip git curl libpng-dev libonig-dev libzip-dev nodejs npm
  - docker-php-ext-install pdo pdo_mysql
  - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  - cd diffEarth
  - pwd
  - composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader
  - npm install
  - npm run build
  - php artisan migrate --force
  - php artisan db:seed --force
  - echo "MAIL_MAILER=$MAIL_MAILER" >> .env
  - echo "MAIL_HOST=$MAIL_HOST" >> .env
  - echo "MAIL_PORT=$MAIL_PORT" >> .env
  - echo "MAIL_USERNAME=$MAIL_USERNAME" >> .env
  - echo "MAIL_PASSWORD=$MAIL_PASSWORD" >> .env
  - echo "MAIL_ENCRYPTION=$MAIL_ENCRYPTION" >> .env
  - echo "MAIL_FROM_ADDRESS=$MAIL_FROM_ADDRESS" >> .env
  - echo "MAIL_FROM_NAME=$MAIL_FROM_NAME" >> .env
  - php artisan config:clear
  - php artisan cache:clear

test:
  stage: test
  script:
    - echo "MAIL_MAILER=$MAIL_MAILER"
    - echo "MAIL_HOST=$MAIL_HOST"
    - echo "MAIL_PORT=$MAIL_PORT"
    - echo "MAIL_USERNAME=$MAIL_USERNAME"
    - echo "MAIL_PASSWORD=$MAIL_PASSWORD"
    - echo "MAIL_ENCRYPTION=$MAIL_ENCRYPTION"
    - echo "MAIL_FROM_ADDRESS=$MAIL_FROM_ADDRESS"
    - echo "MAIL_FROM_NAME=$MAIL_FROM_NAME"
    - vendor/bin/phpunit --testdox
  artifacts:
    reports:
      junit: storage/test-results.xml
    paths:
      - storage/test-results.xml
    expire_in: 1 day
